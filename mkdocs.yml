site_name: Egzamin Ósmoklasisty
site_description: Repozytorium materiałów i opracowań egzaminacyjnych.

extra_css:
  - stylesheets/e8-modern.css
  - stylesheets/e8-dropdown-fix.css
  - stylesheets/e8-longread.css

extra_javascript:
  - javascripts/e8-catalog.js
  - javascripts/e8-study-data.js
  - javascripts/e8-study-polish-2026.js
  - javascripts/e8-study.js

nav:
  - Start: index.md
  - Arkusze PDF: pdfs.md
  - Opracowanie: opracowania/polski-2026.md
  - Notatki (JP): notatki-jezyk-polski.md
  - Notatki (MAT): notatki-matematyka.md
  - Notatki (ANG): notatki-jezyk-angielski.md

theme:
  name: material
  language: pl
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Tryb ciemny
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Tryb jasny
  features:
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.magiclink
  - footnotes

plugins:
  - search
  - git-revision-date-localized:
      type: date
      enable_parallel_processing: false
