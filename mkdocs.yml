site_name: Egzamin Ósmoklasisty
site_description: Repozytorium materiałów i opracowań egzaminacyjnych.

extra_css:
  - stylesheets/e8-modern.css
  - stylesheets/e8-dropdown-fix.css
  - stylesheets/e8-longread.css
  - stylesheets/e8-type-scale.css
  - stylesheets/e8-english.css
  - stylesheets/e8-math.css

extra_javascript:
  - javascripts/e8-catalog.js
  - javascripts/e8-study-data.js
  - javascripts/e8-study-polish-2026.js
  - javascripts/e8-study.js
  - javascripts/e8-tts.js

nav:
  - Start: index.md
  - Arkusze: pdfs.md
  - Język polski: "https://dchorazkiewicz.github.io/Egzamin_8K_JP/pdfs/?subject=jezyk-polski"
  - Matematyka: "https://dchorazkiewicz.github.io/Egzamin_8K_JP/pdfs/?subject=matematyka"
  - Angielski: "https://dchorazkiewicz.github.io/Egzamin_8K_JP/pdfs/?subject=jezyk-angielski"

theme:
  name: material
  language: pl
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Tryb ciemny
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Tryb jasny
  features:
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.magiclink
  - footnotes

plugins:
  - search
  - git-revision-date-localized:
      type: date
      enable_parallel_processing: false
