name: Build and publish educational website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mkdocs.yml"
      - "requirements.txt"
      - "docs/index.md"
      - "docs/pdfs.md"
      - "docs/opracowania/**"
      - "docs/stylesheets/**"
      - "docs/javascripts/**"
      - ".github/workflows/publish-site.yml"

permissions:
  contents: write

concurrency:
  group: e8-publish-gh-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout complete repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install MkDocs and required plugins
        run: python -m pip install -r requirements.txt

      - name: Validate and build website
        run: python -m mkdocs build --clean

      - name: Configure GitHub Actions identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish all pages and assets
        run: python -m mkdocs gh-deploy --force --clean
