name: Sync E8 PDFs and publish website

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Rocznik do aktualizacji"
        required: false
        default: "2026"
  schedule:
    - cron: "25 7 15 * *"
  push:
    branches: [main]
    paths:
      - "docs/sync_exams.py"
      - ".github/workflows/sync-exams.yml"

permissions:
  contents: write

concurrency:
  group: sync-exams-and-pages
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download missing PDFs
        run: python docs/sync_exams.py --year "${{ github.event.inputs.year || '2026' }}" --out docs/pdf

      - name: Rebuild PDF listing
        run: python docs/build_pdf_index.py --pdf-root docs/pdf --out docs/pdfs.md

      - name: Commit new PDFs and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/pdf docs/pdfs.md
          if ! git diff --cached --quiet; then
            git commit -m "Update E8 exam PDFs and catalog"
            git push origin HEAD:main
          fi

      - name: Publish MkDocs to GitHub Pages
        run: mkdocs gh-deploy --force
